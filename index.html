<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PharmaMemo</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f1f5fb;
  color: #193451;
}
header {
  background: #1769aa;
  color: white;
  padding: 22px;
  text-align: center;
}
header h1 { margin: 0 0 8px; }
main { max-width: 850px; margin: auto; padding: 18px; }
button {
  background: #1769aa;
  color: white;
  border: 0;
  border-radius: 9px;
  padding: 12px 17px;
  cursor: pointer;
  margin: 5px 3px;
}
input, textarea {
  width: 100%;
  padding: 12px;
  margin: 6px 0 14px;
  border: 1px solid #cbd5e1;
  border-radius: 8px;
  background: white;
}
label { font-weight: bold; }
.card {
  background: white;
  padding: 16px;
  border-radius: 12px;
  margin: 12px 0;
  box-shadow: 0 2px 8px #0001;
}
.card img { max-width: 140px; display: block; margin-top: 10px; }
.hidden { display: none; }
#status { padding: 10px; }
</style>
</head>
<body>

<header>
  <h1>💊 PharmaMemo</h1>
  <p>Mon catalogue de médicaments</p>
</header>

<main>
  <button id="adminButton">Administration</button>
  <button id="logoutButton" class="hidden">Déconnexion</button>

  <p id="status">Chargement du catalogue...</p>

  <section id="loginSection" class="card hidden">
    <h2>Connexion administrateur</h2>
    <label>Email</label>
    <input id="email" type="email" placeholder="Ton adresse email">
    <label>Mot de passe</label>
    <input id="password" type="password" placeholder="Ton mot de passe">
    <button id="loginButton">Se connecter</button>
  </section>

  <section id="adminSection" class="card hidden">
    <h2>Ajouter un médicament</h2>

    <form id="medicineForm">

      <label>Rayon *</label>
      <input name="rayon" required placeholder="Ex. Cardiologie">

      <label>Famille thérapeutique</label>
      <input name="famille_therapeutique">

      <label>Classe thérapeutique *</label>
      <input name="classe_therapeutique" required>

      <label>DCI *</label>
      <input name="dci" required>

      <label>DC *</label>
      <input name="dc" required>

      <label>Forme galénique</label>
      <input name="forme_galenique">

      <label>Dosage</label>
      <input name="dosage">

      <label>Indications thérapeutiques</label>
      <textarea name="indications_therapeutiques"></textarea>

      <label>Contre-indication majeure</label>
      <textarea name="contre_indication_majeure"></textarea>

      <label>Posologie</label>
      <textarea name="posologie"></textarea>

      <label>Effets indésirables</label>
      <textarea name="effets_indesirables"></textarea>

      <label>Photo de la boîte (obligatoire) *</label>
      <input name="photo_boite" type="file" accept="image/*" required>

      <label>Photo de la notice (facultative)</label>
      <input name="photo_notice" type="file" accept="image/*">

      <button type="submit" id="saveButton">
        Enregistrer le médicament
      </button>
    </form>
  </section>

  <h2>Catalogue des médicaments</h2>
  <div id="medicines"></div>
  <div id="medicine-detail" hidden></div>
</main>

<script type="module">
import { createClient }
from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL = 'https://qulbaraucapotlozcrfx.supabase.co';
const SUPABASE_KEY = 'sb_publishable_ZMNwt__G7PShAkzknd9tAw_L_6BewQx';

const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

const status = document.getElementById('status');
const loginSection = document.getElementById('loginSection');
const adminSection = document.getElementById('adminSection');
const logoutButton = document.getElementById('logoutButton');

function message(text) {
  status.textContent = text;
}

function openMedicine(m) {
  const container = document.getElementById('medicines');
  const detail = document.getElementById('medicine-detail');

  container.hidden = true;
  detail.hidden = false;
  detail.replaceChildren();

  const back = document.createElement('button');
  back.textContent = '← Retour au catalogue';
  back.onclick = () => {
    detail.hidden = true;
    container.hidden = false;
  };
  detail.appendChild(back);

  // En-tête du médicament
  const header = document.createElement('div');
  header.style.background = '#eaf2ff';
  header.style.padding = '18px';
  header.style.borderRadius = '12px';
  header.style.margin = '16px 0';

  const title = document.createElement('h2');
  title.textContent = m.dc || 'Médicament';

  const dci = document.createElement('p');
  dci.textContent = 'DCI : ' + (m.dci || 'Non renseignée');

  const rayon = document.createElement('p');
  rayon.textContent = m.rayon || '';

  header.append(title, dci, rayon);
  detail.appendChild(header);

  // Fonction pour créer une section
  function addSection(titleText, fields) {
    const section = document.createElement('section');
    section.style.background = '#f8fafc';
    section.style.padding = '14px';
    section.style.borderRadius = '10px';
    section.style.margin = '12px 0';

    const heading = document.createElement('h3');
    heading.textContent = titleText;
    section.appendChild(heading);

    fields.forEach(([label, value]) => {
      if (value) {
        const block = document.createElement('div');
        block.style.margin = '10px 0';

const content = document.createElement('p');
content.textContent = value;
content.style.whiteSpace = 'pre-wrap';
content.style.margin = '0';

if (label) {
  const name = document.createElement('strong');
  name.textContent = label;
  block.appendChild(name);
}

block.appendChild(content);
        section.appendChild(block);
      }
    });

    detail.appendChild(section);
  }

addSection('1. Identification', [
  ['Famille thérapeutique', m.famille_therapeutique],
  ['Classe thérapeutique', m.classe_therapeutique],
  ['Forme galénique', m.forme_galenique],
  ['Dosage', m.dosage]
]);

  addSection('2. Indications thérapeutiques', [
  ['', m.indications_therapeutiques]
]);

addSection('3. Contre-indications majeures', [
  ['', m.contre_indication_majeure]
]);

addSection('4. Posologie', [
  ['', m.posologie]
]);

addSection('5. Effets indésirables', [
  ['', m.effets_indesirables]
]);

  // Photos et documents
  const media = document.createElement('section');
  media.style.background = '#f8fafc';
  media.style.padding = '14px';
  media.style.borderRadius = '10px';
  media.style.margin = '12px 0';

  const mediaTitle = document.createElement('h3');
  mediaTitle.textContent = '6. Photos et documents';
  media.appendChild(mediaTitle);

  if (m.photo_boite) {
    const heading = document.createElement('h4');
    heading.textContent = 'Photo de la boîte';

    const img = document.createElement('img');
    img.src = m.photo_boite;
    img.alt = 'Boîte de ' + m.dci;
    img.style.maxWidth = '220px';
    img.style.width = '100%';
    img.style.borderRadius = '8px';

    media.append(heading, img);
  }

  if (m.photo_notice) {
    const heading = document.createElement('h4');
    heading.textContent = 'Photo de la notice';

    const img = document.createElement('img');
    img.src = m.photo_notice;
    img.alt = 'Notice de ' + m.dci;
    img.style.maxWidth = '220px';
    img.style.width = '100%';
    img.style.borderRadius = '8px';

    media.append(heading, img);
  }

  detail.appendChild(media);

  window.scrollTo(0, 0);
}


async function loadMedicines() {
  const container = document.getElementById('medicines');
  const detail = document.getElementById('medicine-detail');

  container.replaceChildren();
  container.hidden = false;
  detail.hidden = true;

  const { data, error } = await supabase
    .from('medicaments')
    .select('*')
    .order('dci');

  if (error) {
    message('Erreur : ' + error.message);
    return;
  }

  if (!data || !data.length) {
    container.textContent = 'Aucun médicament enregistré.';
    message('Catalogue vide.');
    return;
  }

  message(data.length + ' médicament(s) chargé(s).');

  const levels = [
    { field: 'rayon', label: 'Rayons' },
    { field: 'famille_therapeutique', label: 'Familles thérapeutiques' },
    { field: 'classe_therapeutique', label: 'Classes thérapeutiques' },
    { field: 'dci', label: 'DCI' }
  ];

  let path = [];

  function getValue(m, field) {
    return String(m[field] || 'Non renseigné').trim();
  }

  function renderLevel() {
    container.replaceChildren();
    container.hidden = false;
    detail.hidden = true;
if (path.length > 0) {
  const breadcrumb = document.createElement('div');

  path.forEach(step => {
    const line = document.createElement('p');
    line.textContent = step.value;
    line.style.fontSize = '14px';
    line.style.color = '#64748b';
    line.style.fontWeight = '600';
    line.style.margin = '4px 0';
    breadcrumb.appendChild(line);
  });

  container.appendChild(breadcrumb);
}
    if (path.length > 0) {
      const back = document.createElement('button');
      back.textContent = '← Retour';
      back.onclick = () => {
        path.pop();
        renderLevel();
      };
      container.appendChild(back);
    }

    const heading = document.createElement('h2');
    heading.textContent = path.length < 4
      ? levels[path.length].label
      : 'Dénominations commerciales (DC)';

    container.appendChild(heading);

    let items = data.filter(m =>
      path.every(step => getValue(m, step.field) === step.value)
    );

    if (path.length < 4) {
      const field = levels[path.length].field;

      const values = [...new Set(
        items.map(m => getValue(m, field))
      )].sort((a, b) => a.localeCompare(b));

      values.forEach(value => {
        const group = items.filter(
          m => getValue(m, field) === value
        );

        const card = document.createElement('article');
        card.className = 'card';
        card.style.cursor = 'pointer';

        const title = document.createElement('h3');
        title.textContent = value;

        const count = document.createElement('p');
        count.textContent = group.length + ' médicament(s)';

        card.append(title, count);

        card.addEventListener('click', () => {
          path.push({ field, value });
          renderLevel();
        });

        container.appendChild(card);
      });

    } else {
      const commercialNames = [...new Set(
        items.map(m => getValue(m, 'dc'))
      )].sort((a, b) => a.localeCompare(b));

      commercialNames.forEach(name => {
        const group = items.filter(
          m => getValue(m, 'dc') === name
        );

        const medicine = group[0];

        const card = document.createElement('article');
        card.className = 'card';
        card.style.cursor = 'pointer';

        const title = document.createElement('h3');
        title.textContent = name;

        const dosage = document.createElement('p');
        dosage.textContent = 'Dosage : ' + (medicine.dosage || 'Non renseigné');

        card.append(title, dosage);

        card.addEventListener('click', () => {
          openMedicine(medicine);
        });

        container.appendChild(card);
      });
    }

    window.scrollTo(0, 0);
  }

  renderLevel();
}


async function checkAdmin() {
  const { data: sessionData } = await supabase.auth.getSession();
  const user = sessionData.session?.user;

  if (!user) {
    adminSection.classList.add('hidden');
    logoutButton.classList.add('hidden');
    return false;
  }

  const { data, error } = await supabase
    .from('admins')
    .select('user_id')
    .eq('user_id', user.id)
    .maybeSingle();

  if (error || !data) {
    await supabase.auth.signOut();
    message('Ce compte ne possède pas les droits administrateur.');
    return false;
  }

  adminSection.classList.remove('hidden');
  logoutButton.classList.remove('hidden');
  loginSection.classList.add('hidden');
  message('Connecté en tant qu’administrateur.');
  return true;
}

document.getElementById('adminButton').addEventListener('click', async () => {
  const isAdmin = await checkAdmin();
  if (!isAdmin) loginSection.classList.remove('hidden');
});

document.getElementById('loginButton').addEventListener('click', async () => {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  message('Connexion en cours...');

  const { error } = await supabase.auth.signInWithPassword({
    email,
    password
  });

  if (error) {
    message('Erreur de connexion : ' + error.message);
    return;
  }

  const isAdmin = await checkAdmin();
  if (isAdmin) message('Bienvenue dans ton espace administrateur !');
});

logoutButton.addEventListener('click', async () => {
  await supabase.auth.signOut();
  adminSection.classList.add('hidden');
  logoutButton.classList.add('hidden');
  message('Déconnexion effectuée.');
});

async function uploadPhoto(file) {
  if (!file) return null;

  if (!file.type.startsWith('image/')) {
    throw new Error('Le fichier choisi doit être une image.');
  }

  if (file.size > 5 * 1024 * 1024) {
    throw new Error('Chaque image doit faire 5 Mo maximum.');
  }

  const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
  const path = `${crypto.randomUUID()}-${safeName}`;

  const { error } = await supabase.storage
    .from('photos-medicaments')
    .upload(path, file, { contentType: file.type });

  if (error) throw error;

  const { data } = supabase.storage
    .from('photos-medicaments')
    .getPublicUrl(path);

  return data.publicUrl;
}

document.getElementById('medicineForm').addEventListener('submit', async (event) => {
  event.preventDefault();

  const form = event.currentTarget;
  const values = new FormData(form);
  const boxFile = values.get('photo_boite');
  const noticeFile = values.get('photo_notice');

  if (!boxFile || !boxFile.size) {
    message('La photo de la boîte est obligatoire.');
    return;
  }

  const saveButton = document.getElementById('saveButton');
  saveButton.disabled = true;
  message('Enregistrement en cours...');

  try {
    const boxUrl = await uploadPhoto(boxFile);
    const noticeUrl = noticeFile?.size
      ? await uploadPhoto(noticeFile)
      : null;

    const medicine = {
      rayon: values.get('rayon').trim(),
      famille_therapeutique: values.get('famille_therapeutique').trim() || null,
      classe_therapeutique: values.get('classe_therapeutique').trim(),
      dci: values.get('dci').trim(),
      dc: values.get('dc').trim(),
      forme_galenique: values.get('forme_galenique').trim() || null,
      dosage: values.get('dosage').trim() || null,
      indications_therapeutiques: values.get('indications_therapeutiques').trim() || null,
      contre_indication_majeure: values.get('contre_indication_majeure').trim() || null,
      posologie: values.get('posologie').trim() || null,
      effets_indesirables: values.get('effets_indesirables').trim() || null,
      photo_boite: boxUrl,
      photo_notice: noticeUrl
    };

    const { error } = await supabase
      .from('medicaments')
      .insert(medicine);

    if (error) throw error;

    message('Médicament ajouté avec succès !');
    form.reset();
    await loadMedicines();

  } catch (error) {
    message('Erreur : ' + error.message);
  } finally {
    saveButton.disabled = false;
  }
});

await loadMedicines();
await checkAdmin();
</script>

</body>
</html>
