<!DOCTYPE html>

<html lang="fr">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>PharmaMemo</title>

  <style>

    body {

      font-family: Arial, sans-serif;

      background: #f2f6fc;

      color: #183153;

      padding: 20px;

    }

    h1 { color: #1769aa; }

    .medicine {

      background: white;

      padding: 15px;

      margin: 12px 0;

      border-radius: 12px;

      box-shadow: 0 2px 8px #0001;

    }

    #status { color: #555; }

  </style>

</head>

<body>

  <h1>💊 PharmaMemo</h1>

  <p>Mon catalogue de médicaments</p>

  <p id="status">Connexion à la base de données...</p>

  <div id="medicines"></div>

  <script type="module">

    import { createClient }

      from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const SUPABASE_URL = 'https://qulbaraucapotlozcrfx.supabase.co';

    const SUPABASE_KEY = 'sb_publishable_ZMNwt__G7PShAkzknd9tAw_L_6BewQx';

    const supabase = createClient(

      SUPABASE_URL,

      SUPABASE_KEY

    );

    async function loadMedicines() {

      const status = document.getElementById('status');

      const container = document.getElementById('medicines');

      const { data, error } = await supabase

        .from('medicaments')

        .select('id, dci, dc, dosage, rayon, photo_boite')

        .order('dci');

      if (error) {

        status.textContent = 'Erreur de connexion : ' + error.message;

        return;

      }

      status.textContent = data.length +

        ' médicament(s) chargé(s) depuis Supabase.';

      if (data.length === 0) {

        container.textContent = 'Aucun médicament enregistré pour le moment.';

        return;

      }

      data.forEach(m => {

        const card = document.createElement('div');

        card.className = 'medicine';

        const name = document.createElement('h3');

        name.textContent = m.dci;

        const details = document.createElement('p');

        details.textContent =

          (m.dc || '') + ' — ' + (m.dosage || '');

        card.append(name, details);

        if (m.photo_boite) {

          const img = document.createElement('img');

          img.src = m.photo_boite;

          img.alt = 'Boîte de ' + m.dci;

          img.style.maxWidth = '120px';

          card.appendChild(img);

        }

        container.appendChild(card);

      });

    }

    loadMedicines();

  </script>

</body>

</html>
